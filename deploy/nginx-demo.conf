# nginx in front of the run viewer (deploy/demo-site.sh puts it in /etc/nginx/sites-available/pqproof
# with __DOMAIN__ replaced). Plain TLS from Ubuntu's nginx and OpenSSL 3.0: the demo site's own front
# does not offer ML-KEM; the hybrid handshakes PQ-Proof proves happen inside the microVMs.
# Read-only site: GET and HEAD only, small requests, short timeouts, per-address limits.

# Headers are read before nginx knows which server a request is for, so the header timeout must be set here,
# for every server (inside a server block it never applied: a test held a half-sent request open past 25 s).
client_header_timeout 10s;
limit_req_zone $binary_remote_addr zone=pq_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=pq_conn:10m;
server_tokens off;

# anything that does not ask for the demo's name: no answer
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# -- https (demo-site.sh leaves this out until the certificate exists) --
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pq_tls:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 1k;
    client_body_timeout 10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout 15s;
    send_timeout 15s;

    limit_req zone=pq_req burst=40 nodelay;
    limit_conn pq_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        limit_except GET { deny all; }  # GET implies HEAD
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
